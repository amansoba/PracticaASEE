name: Verify Subsonic
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: auth, database: auth}
          - {service: catalog, database: catalog}
          - {service: event, database: events}
          - {service: commerce, database: commerce}
          - {service: provider, database: providers}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: subsonic_test
          POSTGRES_PASSWORD: example-test-only
          POSTGRES_DB: subsonic_${{ matrix.database }}_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U subsonic_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: ${{ matrix.service }}-service/generated/src
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: subsonic_test
      DB_PASSWORD: example-test-only
      JWT_SECRET_KEY: example-test-only-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r ${{ matrix.service }}-service/generated/requirements-dev.txt
      - name: Configure dedicated test database
        run: cp ${{ matrix.service }}-service/generated/.env.test.example ${{ matrix.service }}-service/generated/.env.test
      - run: python -m pytest ${{ matrix.service }}-service/generated/tests -q -p no:cacheprovider
      - run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/check_runtime_contracts.py --service ${{ matrix.service }}
      - name: Create isolated seed database
        env:
          SEED_DB: subsonic_${{ matrix.database }}_seed_test
        run: |
          python - <<'PY'
          import os, psycopg
          from psycopg import sql
          with psycopg.connect(host=os.environ['DB_HOST'], user=os.environ['DB_USER'], password=os.environ['DB_PASSWORD'], dbname='postgres', autocommit=True) as db:
              db.execute(sql.SQL('CREATE DATABASE {}').format(sql.Identifier(os.environ['SEED_DB'])))
          PY
      - name: Verify initialization, repeatable seed and HTTP smoke
        run: python -m pytest tests/test_setup.py -k '${{ matrix.service }}' -q -p no:cacheprovider

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/validate_openapi.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: docker compose run --rm -T --no-deps auth-seed python /app/scripts/smoke.py --url http://frontend
      - if: failure()
        run: docker compose logs --no-color --tail 100
