openapi: 3.0.3
info:
  description: |
    API responsable de la gestión de proveedores externos, catálogo de servicios (sonido, escenarios, barras), espacios alquilables por evento y presupuestos.
    El microservicio de Gestión de Proveedores es propietario de las propuestas y servicios B2B. Para operar se comunica con los siguientes microservicios: - Autenticación y Cuentas: realiza una consulta síncrona GET /users/{userId} para verificar
      identidad, rol y permisos (provider o admin) antes de gestionar solicitudes.
    - Gestión de Eventos: realiza una consulta síncrona GET /events/{eventId} para obtener
      información de fechas y recintos del festival al cual se asigna un espacio o servicio.
  title: API de Gestión de Proveedores - Subsonic Festival
  version: 1.2.0
servers:
- description: Servidor de desarrollo
  url: https://api.subsonic.com/providers/v1
tags:
- description: Gestión y fichas de empresas proveedoras registradas
  name: Proveedores
- description: Catálogo de servicios técnicos y zonas alquilables por recinto
  name: Servicios y Espacios
- description: "Flujo de presupuestos, propuestas y asignación a festivales"
  name: Presupuestos y Solicitudes
paths:
  /providers:
    get:
      description: |
        Devuelve el listado de empresas proveedoras colaboradoras. Operación para administradores.
      operationId: getProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ProviderProfile"
                type: array
          description: Lista de proveedores obtenida correctamente.
        "401":
          description: No autenticado.
        "403":
          description: Acceso denegado. Requiere rol de administrador.
      security:
      - BearerAuth: []
      summary: Listar proveedores registrados
      tags:
      - Proveedores
    post:
      description: |
        Crea la ficha de empresa de un proveedor.
        Antes de registrar al proveedor, este microservicio realiza una COMUNICACIÓN SÍNCRONA de tipo CONSULTA:
        Gestión de Proveedores -> Autenticación y Cuentas -> GET /users/{userId}
        para verificar que el usuario existe y posee el rol 'provider'.
      operationId: createProvider
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderRequest"
        description: Datos fiscales y de contacto de la empresa.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfile"
          description: Proveedor registrado exitosamente.
        "400":
          description: Datos de registro incompletos o inválidos.
        "401":
          description: No autenticado.
        "404":
          description: |
            El usuario asociado no existe según la consulta al microservicio de Autenticación.
        "503":
          description: |
            No se pudo validar el usuario porque el microservicio de Autenticación no está disponible.
      security:
      - BearerAuth: []
      summary: Registrar ficha de proveedor
      tags:
      - Proveedores
  /providers/{id}:
    get:
      description: |
        Devuelve la ficha con datos de contacto, fiscales y servicios de una empresa proveedora.
      operationId: getProviderById
      parameters:
      - description: Identificador único del proveedor.
        example: prov_001
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfile"
          description: Detalle del proveedor encontrado.
        "401":
          description: No autenticado.
        "404":
          description: Proveedor no encontrado.
      security:
      - BearerAuth: []
      summary: Consultar detalle de un proveedor
      tags:
      - Proveedores
  /external-services:
    get:
      description: |
        Devuelve el catálogo de tipos de servicios requeridos (escenarios, sonido, barras, iluminación).
      operationId: getExternalServices
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ExternalService"
                type: array
          description: Catálogo de servicios.
      summary: Consultar catálogo de servicios externos
      tags:
      - Servicios y Espacios
    post:
      description: |
        Añade un nuevo tipo de servicio al catálogo. Operación exclusiva de administradores.
      operationId: createExternalService
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExternalServiceRequest"
        description: Información del servicio.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalService"
          description: Servicio externo creado.
        "401":
          description: No autenticado.
        "403":
          description: Requiere rol de administrador.
      security:
      - BearerAuth: []
      summary: Crear un nuevo tipo de servicio externo
      tags:
      - Servicios y Espacios
  /spaces:
    get:
      description: |
        Devuelve las zonas disponibles para proveedores en un festival específico.
      operationId: getSpacesByEvent
      parameters:
      - description: |
          Identificador del evento al que corresponden los espacios. Referencia hacia el microservicio de Gestión de Eventos.
        example: evt_101
        explode: true
        in: query
        name: event_id
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Space"
                type: array
          description: Lista de espacios devuelta con éxito.
      summary: Listar espacios alquilables de un evento
      tags:
      - Servicios y Espacios
    post:
      description: |
        Registra una zona alquilable en el recinto de un festival.
        Antes de registrar el espacio, este microservicio realiza una COMUNICACIÓN SÍNCRONA de tipo CONSULTA:
        Gestión de Proveedores -> Gestión de Eventos -> GET /events/{eventId}
        para validar que el evento existe y obtener su información de recinto.
      operationId: createSpace
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceRequest"
        description: Información técnica y precio del espacio.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
          description: Espacio publicado exitosamente.
        "401":
          description: No autenticado.
        "403":
          description: Requiere rol de administrador.
        "404":
          description: |
            El evento especificado no existe según la consulta a Gestión de Eventos.
        "503":
          description: |
            No se pudo validar el evento porque el microservicio de Gestión de Eventos no está disponible.
      security:
      - BearerAuth: []
      summary: Publicar un espacio alquilable en un evento
      tags:
      - Servicios y Espacios
  /requests:
    post:
      description: |
        El proveedor envía una cotización para cubrir un servicio o alquilar un espacio.
        Antes de crear la solicitud, este microservicio realiza dos COMUNICACIONES SÍNCRONAS de tipo CONSULTA:
        1. Gestión de Proveedores -> Autenticación y Cuentas -> GET /users/{userId} (Valida permisos del proveedor). 2. Gestión de Proveedores -> Gestión de Eventos -> GET /events/{eventId} (Valida vigencia del festival).
      operationId: createSpaceProposal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceProposalRequest"
        description: Presupuesto propuesto y fechas de montaje.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceProposal"
          description: Propuesta enviada correctamente.
        "400":
          description: Petición incorrecta o montos inválidos.
        "401":
          description: No autenticado.
        "404":
          description: |
            El proveedor o el evento no existen tras consultar a sus respectivos microservicios.
        "503":
          description: |
            No se pudo procesar la propuesta porque alguno de los microservicios dependientes (Autenticación o Eventos) no se encuentra disponible.
      security:
      - BearerAuth: []
      summary: Enviar propuesta de presupuesto para un espacio
      tags:
      - Presupuestos y Solicitudes
  /requests/provider/{providerId}:
    get:
      description: |
        Devuelve el histórico de presupuestos presentados por una empresa colaboradora.
      operationId: getProposalsByProvider
      parameters:
      - description: Identificador del proveedor.
        example: prov_001
        explode: false
        in: path
        name: providerId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/SpaceProposal"
                type: array
          description: Historial de propuestas del proveedor.
        "401":
          description: No autenticado.
        "403":
          description: Acceso denegado a las propuestas de este proveedor.
      security:
      - BearerAuth: []
      summary: Ver propuestas enviadas por un proveedor
      tags:
      - Presupuestos y Solicitudes
  /requests/event/{eventId}:
    get:
      description: |
        Devuelve los presupuestos recibidos para un evento concreto. Operación para administradores.
      operationId: getProposalsByEvent
      parameters:
      - description: |
          Identificador del evento consultado (referencia a Gestión de Eventos).
        example: evt_101
        explode: false
        in: path
        name: eventId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/SpaceProposal"
                type: array
          description: Lista de propuestas a evaluar.
        "401":
          description: No autenticado.
        "403":
          description: Requiere rol de administrador.
      security:
      - BearerAuth: []
      summary: Listar propuestas recibidas para un festival
      tags:
      - Presupuestos y Solicitudes
  /requests/{id}/status:
    put:
      description: |
        Actualiza el estado de la propuesta (approved / rejected) y asigna formalmente al proveedor para el evento. Operación reservada para administradores.
      operationId: updateProposalStatus
      parameters:
      - description: Identificador de la propuesta de presupuesto.
        example: req_9988
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateProposalStatus_request"
        description: Resolución de la propuesta.
        required: true
      responses:
        "200":
          description: Estado del presupuesto actualizado.
        "401":
          description: No autenticado.
        "403":
          description: Requiere rol de administrador.
        "404":
          description: La propuesta indicada no existe.
      security:
      - BearerAuth: []
      summary: Aprobar o rechazar presupuesto (Asignación)
      tags:
      - Presupuestos y Solicitudes
components:
  schemas:
    CreateProviderRequest:
      example:
        user_id: usr_555
        company_name: Sonido e Iluminación Total S.L.
        cif_nif: B12345678
        service_category: Sonido
        contact_email: contacto@sonidototal.com
      properties:
        user_id:
          description: |
            Identificador del usuario en el microservicio de Autenticación y Cuentas al que se vinculará la ficha de la empresa proveedora.
          example: usr_555
          title: user_id
          type: string
        company_name:
          description: Nombre fiscal de la empresa.
          example: Sonido e Iluminación Total S.L.
          title: company_name
          type: string
        cif_nif:
          description: Identificador fiscal (CIF o NIF).
          example: B12345678
          title: cif_nif
          type: string
        service_category:
          description: "Categoría del servicio ofertado (Sonido, Barras, Escenarios)."
          example: Sonido
          title: service_category
          type: string
        contact_email:
          description: Correo electrónico comercial de contacto.
          example: contacto@sonidototal.com
          format: email
          title: contact_email
          type: string
      required:
      - cif_nif
      - company_name
      - contact_email
      - service_category
      - user_id
      title: CreateProviderRequest
      type: object
    ProviderProfile:
      example:
        id: prov_001
        user_id: usr_555
        company_name: Sonido e Iluminación Total S.L.
        cif_nif: B12345678
        service_category: Sonido
        contact_email: contacto@sonidototal.com
      properties:
        id:
          description: Identificador único del proveedor en este microservicio.
          example: prov_001
          title: id
          type: string
        user_id:
          description: Identificador del usuario propietario (Autenticación y Cuentas).
          example: usr_555
          title: user_id
          type: string
        company_name:
          description: Denominación comercial o razón social.
          example: Sonido e Iluminación Total S.L.
          title: company_name
          type: string
        cif_nif:
          description: Número de identificación fiscal.
          example: B12345678
          title: cif_nif
          type: string
        service_category:
          description: Categoría de servicio principal.
          example: Sonido
          title: service_category
          type: string
        contact_email:
          description: Email de contacto.
          example: contacto@sonidototal.com
          format: email
          title: contact_email
          type: string
      required:
      - cif_nif
      - company_name
      - id
      - service_category
      - user_id
      title: ProviderProfile
      type: object
    CreateExternalServiceRequest:
      example:
        name: Instalación de Sonido Profesional
        description: Equipos de sonido de alta potencia para escenarios principales.
      properties:
        name:
          description: Nombre del tipo de servicio externo.
          example: Instalación de Sonido Profesional
          title: name
          type: string
        description:
          description: Descripción de requerimientos técnicos del servicio.
          example: Equipos de sonido de alta potencia para escenarios principales.
          title: description
          type: string
      required:
      - name
      title: CreateExternalServiceRequest
      type: object
    ExternalService:
      example:
        id: srv_01
        name: Instalación de Sonido Profesional
        description: Equipos de sonido de alta potencia para escenarios principales.
      properties:
        id:
          description: Identificador del servicio externo en este microservicio.
          example: srv_01
          title: id
          type: string
        name:
          description: Nombre del tipo de servicio.
          example: Instalación de Sonido Profesional
          title: name
          type: string
        description:
          description: Descripción técnica.
          example: Equipos de sonido de alta potencia para escenarios principales.
          title: description
          type: string
      required:
      - id
      - name
      title: ExternalService
      type: object
    CreateSpaceRequest:
      example:
        event_id: evt_101
        name: Escenario Principal - Zona de Sonido
        dimensions: 20m x 15m
        base_price: 1200.0
        is_available: true
      properties:
        event_id:
          description: |
            Identificador del evento al que pertenece el espacio. Pertenece al microservicio de Gestión de Eventos y se usa como referencia.
          example: evt_101
          title: event_id
          type: string
        name:
          description: Nombre descriptivo del espacio.
          example: Escenario Principal - Zona de Sonido
          title: name
          type: string
        dimensions:
          description: Medidas y superficie del espacio disponible.
          example: 20m x 15m
          title: dimensions
          type: string
        base_price:
          description: Tarifa base de alquiler del espacio en euros.
          example: 1200.0
          format: float
          title: base_price
          type: number
        is_available:
          description: Disponibilidad del espacio para alquiler.
          example: true
          title: is_available
          type: boolean
      required:
      - base_price
      - event_id
      - name
      title: CreateSpaceRequest
      type: object
    Space:
      example:
        id: spc_010
        event_id: evt_101
        name: Escenario Principal - Zona de Sonido
        dimensions: 20m x 15m
        base_price: 1200.0
        is_available: true
      properties:
        id:
          description: Identificador único del espacio en este microservicio.
          example: spc_010
          title: id
          type: string
        event_id:
          description: Referencia foránea hacia Gestión de Eventos.
          example: evt_101
          title: event_id
          type: string
        name:
          description: Nombre de la zona o espacio.
          example: Escenario Principal - Zona de Sonido
          title: name
          type: string
        dimensions:
          description: Medidas del espacio.
          example: 20m x 15m
          title: dimensions
          type: string
        base_price:
          description: Precio base de alquiler.
          example: 1200.0
          format: float
          title: base_price
          type: number
        is_available:
          description: Indica si el espacio está libre para nuevas propuestas.
          example: true
          title: is_available
          type: boolean
      required:
      - base_price
      - event_id
      - id
      - is_available
      - name
      title: Space
      type: object
    CreateSpaceProposalRequest:
      example:
        space_id: spc_010
        provider_id: prov_001
        event_id: evt_101
        budget_proposal: 1150.0
        setup_date: 2027-07-18
      properties:
        space_id:
          description: Identificador del espacio por el que se puja (pertenece a este
            microservicio).
          example: spc_010
          title: space_id
          type: string
        provider_id:
          description: Identificador del proveedor solicitante (pertenece a este microservicio).
          example: prov_001
          title: provider_id
          type: string
        event_id:
          description: |
            Identificador del festival al que corresponde la propuesta. Pertenece al microservicio de Gestión de Eventos.
          example: evt_101
          title: event_id
          type: string
        budget_proposal:
          description: Importe total presupuestado en euros.
          example: 1150.0
          format: float
          title: budget_proposal
          type: number
        setup_date:
          description: Fecha planificada de montaje en el recinto.
          example: 2027-07-18
          format: date
          title: setup_date
          type: string
      required:
      - budget_proposal
      - event_id
      - provider_id
      - space_id
      title: CreateSpaceProposalRequest
      type: object
    SpaceProposal:
      example:
        id: req_9988
        space_id: spc_010
        provider_id: prov_001
        event_id: evt_101
        budget_proposal: 1150.0
        setup_date: 2027-07-18
        status: pending
      properties:
        id:
          description: Identificador único de la propuesta de presupuesto.
          example: req_9988
          title: id
          type: string
        space_id:
          description: Identificador del espacio.
          example: spc_010
          title: space_id
          type: string
        provider_id:
          description: Identificador del proveedor.
          example: prov_001
          title: provider_id
          type: string
        event_id:
          description: Referencia al evento (Gestión de Eventos).
          example: evt_101
          title: event_id
          type: string
        budget_proposal:
          description: Presupuesto ofertado.
          example: 1150.0
          format: float
          title: budget_proposal
          type: number
        setup_date:
          description: Fecha de montaje propuesta.
          example: 2027-07-18
          format: date
          title: setup_date
          type: string
        status:
          description: Estado del proceso de evaluación del presupuesto.
          enum:
          - pending
          - approved
          - rejected
          example: pending
          title: status
          type: string
      required:
      - budget_proposal
      - event_id
      - id
      - provider_id
      - space_id
      - status
      title: SpaceProposal
      type: object
    updateProposalStatus_request:
      properties:
        status:
          description: Estado de asignación del presupuesto.
          enum:
          - pending
          - approved
          - rejected
          example: approved
          title: status
          type: string
      required:
      - status
      title: updateProposalStatus_request
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
