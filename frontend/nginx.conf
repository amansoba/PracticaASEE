map $api_service $api_backend {
    auth         auth;
    catalogo     catalog;
    eventos      event;
    tienda       commerce;
    proveedores  provider;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve Compose service names through Docker's internal DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/api/(?<api_service>auth|catalogo|eventos|tienda|proveedores)(?:/|$) {
        rewrite ^/api/[^/]+/?(.*)$ /$1 break;
        proxy_pass http://$api_backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
