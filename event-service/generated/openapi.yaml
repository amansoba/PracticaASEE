openapi: 3.0.3
info:
  description: |
    API responsable de la gestión de festivales, fechas, recintos, horarios/line-up, configuración de tipos de pases y emisión y venta de entradas.
    El microservicio de Gestión de Eventos es propietario de las ediciones del festival, la programación horaria y las entradas adquiridas. Para operar se comunica con: - Catálogo Musical: realiza una consulta síncrona GET /artists/{id} para validar la existencia
      del artista antes de asignarlo a un escenario en el line-up.
    - Autenticación y Cuentas: realiza una consulta síncrona GET /users/{userId} al momento de
      la compra de entradas para asociar el pase emitido al usuario correspondiente.
    - Gestión de Proveedores: proporciona información del festival (GET /events/{id})
      para permitir la asignación de espacios y servicios externos.
  title: API de Gestión de Eventos - Subsonic Festival
  version: 1.2.0
servers:
- description: Servidor de desarrollo
  url: https://api.subsonic.com/events/v1
tags:
- description: "Gestión general de festivales, ubicaciones y fechas"
  name: Eventos
- description: Horarios de actuaciones y asignación de escenarios
  name: Line-up
- description: "Configuración de tipos de pase, venta y consulta de entradas de usuarios"
  name: Pases y Entradas
paths:
  /events:
    get:
      description: |
        Devuelve la lista general de eventos y ediciones de festivales configurados.
      operationId: getAllEvents
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Event"
                type: array
          description: Lista de eventos devuelta correctamente.
      summary: Listar todos los festivales y eventos
      tags:
      - Eventos
    post:
      description: |
        Da de alta un festival indicando nombre, fechas y recinto. Operación restringida a administradores.
      operationId: createEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
        description: Información básica del evento.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
          description: Evento registrado exitosamente.
        "400":
          description: Datos del evento incompletos.
        "401":
          description: No autenticado.
        "403":
          description: Acceso denegado. Requiere rol de administrador.
      security:
      - BearerAuth: []
      summary: Crear un nuevo evento o edición
      tags:
      - Eventos
  /events/{id}:
    delete:
      description: |
        Elimina un festival del sistema. Operación para administradores.
      operationId: deleteEvent
      parameters:
      - description: Identificador del evento a cancelar.
        example: evt_101
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Evento eliminado satisfactoriamente.
        "401":
          description: No autenticado.
        "403":
          description: Acceso denegado.
        "404":
          description: Evento no encontrado.
      security:
      - BearerAuth: []
      summary: Cancelar o eliminar un evento
      tags:
      - Eventos
    get:
      description: |
        Devuelve las fechas, recinto y ubicación de un festival. Endpoint consultado de forma síncrona por Gestión de Proveedores para asociar espacios y servicios.
      operationId: getEventById
      parameters:
      - description: Identificador único del evento.
        example: evt_101
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
          description: Detalles del evento.
        "404":
          description: No existe ningún evento con el identificador proporcionado.
      summary: Consultar detalles de un evento
      tags:
      - Eventos
    put:
      description: |
        Permite actualizar fechas o recintos de un evento existente. Operación para administradores.
      operationId: updateEvent
      parameters:
      - description: Identificador del evento a actualizar.
        example: evt_101
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
        description: Nuevos datos del evento.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
          description: Evento actualizado correctamente.
        "401":
          description: No autenticado.
        "403":
          description: Acceso denegado.
        "404":
          description: Evento no encontrado.
      security:
      - BearerAuth: []
      summary: Actualizar información de un evento
      tags:
      - Eventos
  /events/{id}/lineup:
    get:
      description: |
        Devuelve las actuaciones programadas en los escenarios y sus franjas horarias.
      operationId: getEventLineup
      parameters:
      - description: Identificador del evento.
        example: evt_101
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ScheduleEntry"
                type: array
          description: Horarios y cartel devueltos con éxito.
        "404":
          description: El evento especificado no existe.
      summary: Obtener el cartel (Line-up) y horarios del festival
      tags:
      - Line-up
    post:
      description: |
        Registra la actuación de un artista en un escenario y franja horaria.
        Antes de crear la entrada, este microservicio realiza una COMUNICACIÓN SÍNCRONA de tipo CONSULTA:
        Gestión de Eventos -> Catálogo Musical -> GET /artists/{artistId}
        para validar que el artista existe en el catálogo musical.
      operationId: addScheduleEntry
      parameters:
      - description: Identificador del evento al que se añade la actuación.
        example: evt_101
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleEntryRequest"
        description: "Datos del artista, escenario y horario."
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEntry"
          description: Actuación añadida al cartel correctamente.
        "400":
          description: Solapamiento horario o datos incorrectos.
        "401":
          description: No autenticado.
        "403":
          description: Acceso denegado.
        "404":
          description: |
            El evento o el artista no existen. Este error puede producirse si la consulta síncrona a Catálogo Musical devuelve un 404.
        "503":
          description: |
            No se pudo validar el artista porque el microservicio de Catálogo Musical no se encuentra disponible.
      security:
      - BearerAuth: []
      summary: Añadir una actuación al line-up del evento
      tags:
      - Line-up
  /events/{id}/passes:
    get:
      description: |
        Devuelve los tipos de entrada disponibles para el evento (general, VIP, abono).
      operationId: getPassConfigsByEvent
      parameters:
      - description: Identificador del evento.
        example: evt_101
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/PassConfig"
                type: array
          description: Tipos de pases configurados.
        "404":
          description: Evento no encontrado.
      summary: Consultar los tipos de pases y aforo configurado
      tags:
      - Pases y Entradas
    post:
      description: |
        Define precio, aforo máximo y beneficios de una modalidad de entrada. Operación para administradores.
      operationId: createPassConfig
      parameters:
      - description: Identificador del evento al que se asigna la entrada.
        example: evt_101
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePassConfigRequest"
        description: Configuración del pase y aforo.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassConfig"
          description: Modalidad de pase dada de alta exitosamente.
        "401":
          description: No autenticado.
        "403":
          description: Acceso denegado.
      security:
      - BearerAuth: []
      summary: Configurar un nuevo tipo de pase para el evento
      tags:
      - Pases y Entradas
  /tickets/purchase:
    post:
      description: |
        Emite una entrada nominal y decrementa el aforo del pase.
        Antes de emitir la entrada, este microservicio realiza una COMUNICACIÓN SÍNCRONA de tipo CONSULTA:
        Gestión de Eventos -> Autenticación y Cuentas -> GET /users/{userId}
        para validar la identidad del comprador y asociar la entrada a su propietario.
      operationId: purchaseTicket
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketPurchaseRequest"
        description: "Identificadores del evento, tipo de pase, usuario y token de\
          \ pago."
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
          description: Entrada emitida y asociada exitosamente al usuario.
        "400":
          description: Datos de compra incompletos.
        "401":
          description: No autenticado.
        "404":
          description: |
            El usuario indicado no existe según la consulta a Autenticación y Cuentas, o el tipo de pase seleccionado no existe.
        "409":
          description: Aforo máximo completado. No quedan entradas disponibles para
            este pase.
        "503":
          description: |
            No se pudo verificar la identidad del comprador porque el microservicio de Autenticación y Cuentas no está disponible.
      security:
      - BearerAuth: []
      summary: Comprar una entrada / pase para un evento
      tags:
      - Pases y Entradas
  /tickets/user/{userId}:
    get:
      description: |
        Devuelve el listado de entradas emitidas asociadas al identificador del comprador.
      operationId: getTicketsByUser
      parameters:
      - description: Identificador del usuario propietario de las entradas.
        example: usr_555
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Ticket"
                type: array
          description: Entradas del usuario.
        "401":
          description: No autenticado.
        "403":
          description: Acceso denegado. No se pueden consultar entradas de otro usuario.
      security:
      - BearerAuth: []
      summary: Consultar las entradas adquiridas por un usuario
      tags:
      - Pases y Entradas
components:
  schemas:
    CreateEventRequest:
      example:
        name: Subsonic Summer Edition
        start_date: 2027-07-20
        end_date: 2027-07-22
        venue: Recinto Ferial IFEMA
        location_city: Madrid
      properties:
        name:
          description: Nombre oficial de la edición del festival.
          example: Subsonic Summer Edition
          title: name
          type: string
        start_date:
          description: Fecha de inicio del festival.
          example: 2027-07-20
          format: date
          title: start_date
          type: string
        end_date:
          description: Fecha de finalización del festival.
          example: 2027-07-22
          format: date
          title: end_date
          type: string
        venue:
          description: Nombre del recinto o complejo.
          example: Recinto Ferial IFEMA
          title: venue
          type: string
        location_city:
          description: Ciudad de celebración.
          example: Madrid
          title: location_city
          type: string
      required:
      - end_date
      - location_city
      - name
      - start_date
      - venue
      title: CreateEventRequest
      type: object
    Event:
      example:
        id: evt_101
        name: Subsonic Summer Edition
        start_date: 2027-07-20
        end_date: 2027-07-22
        venue: Recinto Ferial IFEMA
        location_city: Madrid
      properties:
        id:
          description: Identificador único del festival en este microservicio.
          example: evt_101
          title: id
          type: string
        name:
          description: Nombre de la edición.
          example: Subsonic Summer Edition
          title: name
          type: string
        start_date:
          description: Fecha de inicio.
          example: 2027-07-20
          format: date
          title: start_date
          type: string
        end_date:
          description: Fecha de cierre.
          example: 2027-07-22
          format: date
          title: end_date
          type: string
        venue:
          description: Recinto o recinto ferial.
          example: Recinto Ferial IFEMA
          title: venue
          type: string
        location_city:
          description: Ciudad donde se ubica el festival.
          example: Madrid
          title: location_city
          type: string
      required:
      - end_date
      - id
      - location_city
      - name
      - start_date
      - venue
      title: Event
      type: object
    CreateScheduleEntryRequest:
      example:
        artist_id: art_12345
        artist_name: Daft Punk
        stage: Main Stage
        start_time: 2027-07-20T22:00:00Z
        end_time: 2027-07-20T23:30:00Z
      properties:
        artist_id:
          description: |
            Identificador del artista. El dato pertenece al microservicio de Catálogo Musical y se utiliza como referencia foránea.
          example: art_12345
          title: artist_id
          type: string
        artist_name:
          description: Nombre del artista para visualización rápida.
          example: Daft Punk
          title: artist_name
          type: string
        stage:
          description: Nombre del escenario dentro del recinto.
          example: Main Stage
          title: stage
          type: string
        start_time:
          description: Fecha y hora exacta de inicio de la actuación.
          example: 2027-07-20T22:00:00Z
          format: date-time
          title: start_time
          type: string
        end_time:
          description: Fecha y hora estimada de finalización.
          example: 2027-07-20T23:30:00Z
          format: date-time
          title: end_time
          type: string
      required:
      - artist_id
      - end_time
      - stage
      - start_time
      title: CreateScheduleEntryRequest
      type: object
    ScheduleEntry:
      example:
        id: sch_001
        artist_id: art_12345
        artist_name: Daft Punk
        stage: Main Stage
        start_time: 2027-07-20T22:00:00Z
        end_time: 2027-07-20T23:30:00Z
      properties:
        id:
          description: Identificador de la franja horaria en el line-up.
          example: sch_001
          title: id
          type: string
        artist_id:
          description: Referencia foránea hacia el artista en Catálogo Musical.
          example: art_12345
          title: artist_id
          type: string
        artist_name:
          description: Nombre del artista.
          example: Daft Punk
          title: artist_name
          type: string
        stage:
          description: Escenario asignado.
          example: Main Stage
          title: stage
          type: string
        start_time:
          description: Inicio de la presentación.
          example: 2027-07-20T22:00:00Z
          format: date-time
          title: start_time
          type: string
        end_time:
          description: Fin de la presentación.
          example: 2027-07-20T23:30:00Z
          format: date-time
          title: end_time
          type: string
      required:
      - artist_id
      - end_time
      - id
      - stage
      - start_time
      title: ScheduleEntry
      type: object
    CreatePassConfigRequest:
      example:
        type_name: Abono VIP 3 Días
        price: 150.0
        capacity: 5000
        benefits:
        - Acceso Front Stage
        - Barra libre
      properties:
        type_name:
          description: Nombre comercial del tipo de pase (ej. Abono VIP 3 Días).
          example: Abono VIP 3 Días
          title: type_name
          type: string
        price:
          description: Precio unitario de la entrada en euros.
          example: 150.0
          format: float
          title: price
          type: number
        capacity:
          description: Aforo total reservado para este tipo de pase.
          example: 5000
          title: capacity
          type: integer
        benefits:
          description: Ventajas asociadas al pase.
          example:
          - Acceso Front Stage
          - Barra libre
          items:
            type: string
          title: benefits
          type: array
      required:
      - capacity
      - price
      - type_name
      title: CreatePassConfigRequest
      type: object
    PassConfig:
      example:
        id: pass_001
        event_id: evt_101
        type_name: Abono VIP 3 Días
        price: 150.0
        capacity: 5000
        available_tickets: 4890
        benefits:
        - Acceso Front Stage
        - Barra libre
      properties:
        id:
          description: Identificador único del tipo de pase.
          example: pass_001
          title: id
          type: string
        event_id:
          description: Identificador del festival al que pertenece el pase.
          example: evt_101
          title: event_id
          type: string
        type_name:
          description: Nombre de la modalidad de entrada.
          example: Abono VIP 3 Días
          title: type_name
          type: string
        price:
          description: Coste en euros.
          example: 150.0
          format: float
          title: price
          type: number
        capacity:
          description: Aforo total.
          example: 5000
          title: capacity
          type: integer
        available_tickets:
          description: Entradas restantes disponibles para venta.
          example: 4890
          title: available_tickets
          type: integer
        benefits:
          description: Beneficios incluidos.
          example:
          - Acceso Front Stage
          - Barra libre
          items:
            type: string
          title: benefits
          type: array
      required:
      - available_tickets
      - capacity
      - event_id
      - id
      - price
      - type_name
      title: PassConfig
      type: object
    TicketPurchaseRequest:
      example:
        event_id: evt_101
        pass_id: pass_001
        user_id: usr_555
        payment_token: tok_visa_4242
      properties:
        event_id:
          description: Identificador del evento para el que se adquiere la entrada.
          example: evt_101
          title: event_id
          type: string
        pass_id:
          description: Identificador del tipo de pase seleccionado.
          example: pass_001
          title: pass_id
          type: string
        user_id:
          description: |
            Identificador del usuario comprador. Pertenece al microservicio de Autenticación y Cuentas y se utiliza para asociar la propiedad de la entrada.
          example: usr_555
          title: user_id
          type: string
        payment_token:
          description: Token de pasarela de pago para confirmar la transacción.
          example: tok_visa_4242
          title: payment_token
          type: string
      required:
      - event_id
      - pass_id
      - user_id
      title: TicketPurchaseRequest
      type: object
    Ticket:
      example:
        id: tck_9901
        event_id: evt_101
        pass_id: pass_001
        user_id: usr_555
        qr_code: SUBSONIC-TCK-9901-SECURE
        status: valid
        purchased_at: 2027-01-15T10:00:00Z
      properties:
        id:
          description: Identificador único de la entrada emitida.
          example: tck_9901
          title: id
          type: string
        event_id:
          description: Evento asociado.
          example: evt_101
          title: event_id
          type: string
        pass_id:
          description: Tipo de pase emitido.
          example: pass_001
          title: pass_id
          type: string
        user_id:
          description: Identificador del usuario propietario de la entrada (Autenticación
            y Cuentas).
          example: usr_555
          title: user_id
          type: string
        qr_code:
          description: Código seguro para el control de acceso en recinto.
          example: SUBSONIC-TCK-9901-SECURE
          title: qr_code
          type: string
        status:
          description: Estado de validez de la entrada.
          enum:
          - valid
          - used
          - cancelled
          example: valid
          title: status
          type: string
        purchased_at:
          description: Fecha y hora exacta de compra.
          example: 2027-01-15T10:00:00Z
          format: date-time
          title: purchased_at
          type: string
      required:
      - event_id
      - id
      - pass_id
      - purchased_at
      - qr_code
      - status
      - user_id
      title: Ticket
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
