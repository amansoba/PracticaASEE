server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/auth/ { proxy_pass http://auth:8000/; }
    location /api/catalogo/ { proxy_pass http://catalog:8000/; }
    location /api/eventos/ { proxy_pass http://event:8000/; }
    location /api/tienda/ { proxy_pass http://commerce:8000/; }
    location /api/proveedores/ { proxy_pass http://provider:8000/; }
    location / { try_files $uri $uri/ /index.html; }
}
